
<!-- CETEIcean and TEI display JS -->
<script src="{{ site.baseurl }}/assets/js/CETEI.js"></script>
{% if page.permalink == '/deh/' %}
<script type="module" src="{{ site.baseurl }}/assets/js/dehParallels.js?v={{ site.time | date: '%s' }}"></script>
{% endif %}
<script src="{{ site.baseurl }}/assets/js/renderTei.js"></script>

{% if site.enable_tooltips %}
<!-- Enable Tooltips -->
<script type="text/javascript">
$(function () {$('[data-toggle="tooltip"]').tooltip()})
</script>
{% endif %}

{% if site.enable_medium_zoom %}
<!-- Medium Zoom JS -->
<script src="https://cdn.jsdelivr.net/npm/medium-zoom@{{ site.medium_zoom.version }}/dist/medium-zoom.min.js" integrity="{{ site.medium_zoom.integrity }}" crossorigin="anonymous"></script>
<script src="{{ '/assets/js/zoom.js' | relative_url }}"></script>
{% endif %}

<!-- Load Common JS -->
<script src="{{ '/assets/js/common.js' | relative_url }}"></script>
