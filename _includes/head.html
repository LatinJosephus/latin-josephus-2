<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>
  {{ site.title }}
  {% if page.title != "blank" and page.url != "/" %}
  | {{ page.title }}
  {% endif %}
</title>
<meta name="description" content="{% if page.release_date %}{{ page.description | escape }}{% else %}{{ site.description }}{% endif %}">

<!-- Open Graph -->
{% if site.serve_og_meta and page.release_date == nil %}
<meta property="og:site_name" content="{{ site.description }}" />
<meta property="og:type" content="object" />
<meta property="og:title" content="{{ site.name }}" />
<meta property="og:url" content="{{ page.url | prepend: site.baseurl | prepend: site.url }}" />
<meta property="og:description" content="{{ page.title }}" />
<meta property="og:image"
  content="{%- if page.og_image -%}{{ page.og_image }}{%- else -%}{{ site.og_image }}{%- endif -%}" />
{% endif %}

<!-- Bootstrap & MDB -->
<link href="https://stackpath.bootstrapcdn.com/bootstrap/{{ site.bootstrap.version }}/css/bootstrap.min.css"
  rel="stylesheet" integrity="{{ site.bootstrap.integrity.css }}" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdbootstrap/{{ site.mdb.version }}/css/mdb.min.css"
  integrity="{{ site.mdb.integrity.css }}" crossorigin="anonymous" />

<!-- Fonts & Icons -->
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/{{ site.fontawesome.version }}/css/all.min.css"
  integrity="{{ site.fontawesome.integrity }}" crossorigin="anonymous">
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/academicons/{{ site.academicons.version }}/css/academicons.min.css"
  integrity="{{ site.academicons.integrity }}" crossorigin="anonymous">
<link rel="stylesheet" type="text/css"
  href="https://fonts.googleapis.com/css?family=Material+Icons">

<!-- Styles -->
<!-- Bamberg identity: LI icon, simplified for browser tabs. -->
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/brand/bamberg/bamberg-favicon-light-32.png' | relative_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/img/brand/bamberg/bamberg-micro-icon-light.svg' | relative_url }}">
<link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: dark)" href="{{ '/assets/img/brand/bamberg/bamberg-micro-icon-dark.svg' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/brand/bamberg/bamberg-favicon-light-180.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ page.main_css_version | default: '20261102-reader-steps' }}">
<link rel="canonical" href="{% if page.release_date %}{{ page.url | absolute_url }}{% else %}{{ page.url | replace:'index.html','' | relative_url }}{% endif %}">{% if page.release_date %}
<meta name="author" content="{{ page.author | escape }}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:description" content="{{ page.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ page.og_image | absolute_url }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="2880">
<meta property="og:image:height" content="1620">
<meta property="og:image:alt" content="{{ page.og_image_alt | escape }}">
<meta property="article:published_time" content="{{ page.release_date }}">
<link rel="stylesheet" href="{{ '/assets/css/release-announcement.css' | relative_url }}">{% endif %}

{% if site.enable_darkmode %}
<!-- Dark Mode -->
<script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
<script src="{{ '/assets/js/dark_mode.js' | relative_url }}"></script>
{% endif %}
