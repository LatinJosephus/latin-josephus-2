<div class="accordion card fixed-bottom" id="reader-annotations">
  <div class="accordion-item">
    <h3 class="accordion-header" id="annotations-header">
      <button
        class="accordion-button"
        type="button"
        aria-expanded="false"
        aria-controls="collapse-annotations"
      >
        Manuscript annotations
      </button>
    </h3>
    <div
      id="collapse-annotations"
      class="accordion-collapse collapse"
      aria-labelledby="annotations-header"
      data-mdb-parent="#reader-annotations"
    >
      <div id="annotations-list" class="accordion-body">

      </div>
    </div>
  </div>
</div>
