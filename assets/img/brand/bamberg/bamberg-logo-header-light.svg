<title id="title">Latin Josephus — Bamberg header lockup</title>
<desc id="desc">New LI emblem beside an outlined two-line LATIN JOSEPHUS wordmark; a compact alternative for narrow website headers. Newly drawn design adapted from Staatsbibliothek Bamberg, Msc.Class.78, f. 2r. It is not a manuscript facsimile.</desc>
